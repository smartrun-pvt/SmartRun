    <script>
      // Gracefully silence benign [vite] websocket connection errors in AI Studio iframe/sandboxed environments
      (function() {
        const origWarn = console.warn;
        const origError = console.error;
        const origDebug = console.debug;
        const origInfo = console.info;
        const isBenignViteMsg = function(msg) {
          if (!msg) return false;
          const str = String(msg);
          return (
            str.includes('[vite] connecting...') ||
            str.includes('[vite] failed to connect to websocket') ||
            str.includes('WebSocket closed') ||
            str.includes('WebSocket is closed') ||
            str.includes('failed to connect to websocket') ||
            str.includes('vite:ws') ||
            str.includes('BillingNotEnabledMapError') ||
            str.includes('billing-not-enabled-map-error')
          );
        };
        console.warn = function(...args) {
          if (args.some(isBenignViteMsg)) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (args.some(isBenignViteMsg)) {
            window.dispatchEvent(new CustomEvent('google_maps_billing_failure'));
            return;
          }
          origError.apply(console, args);
        };
        console.debug = function(...args) {
          if (args.some(isBenignViteMsg)) return;
          origDebug.apply(console, args);
        };
        console.info = function(...args) {
          if (args.some(isBenignViteMsg)) return;
          origInfo.apply(console, args);
        };
      })();

      // Suppress Google Maps alert modal and notify application components
      window.gm_authFailure = function() {
        console.warn('[GoogleMaps] Authentication or Billing notice triggered. Switching to resilient delivery map.');
        window.dispatchEvent(new CustomEvent('google_maps_billing_failure'));
      };

      // Neutralize Vite's internal HMR WebSocket in preview iframe where HMR is disabled
      if (typeof window !== 'undefined' && window.WebSocket) {
        const RealWebSocket = window.WebSocket;
        function MockWebSocket(url, protocols) {
          if (typeof url === 'string' && (url.includes('/@vite/client') || url.includes('vite') || url.includes(':3000'))) {
            this.readyState = 1; // OPEN
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.url = url;
            this.close = function() {};
            this.send = function() {};
            this.addEventListener = function(event, callback) {
              if (event === 'open' && typeof callback === 'function') {
                setTimeout(callback, 0);
              }
            };
            this.removeEventListener = function() {};
            this.dispatchEvent = function() { return false; };
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;
            return;
          }
          return new RealWebSocket(url, protocols);
        }
        MockWebSocket.CONNECTING = 0;
        MockWebSocket.OPEN = 1;
        MockWebSocket.CLOSING = 2;
        MockWebSocket.CLOSED = 3;
        MockWebSocket.prototype = RealWebSocket.prototype;
        window.WebSocket = MockWebSocket;
      }

      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (
            String(event.reason).includes('WebSocket closed') ||
            String(event.reason?.message || '').includes('WebSocket closed') ||
            String(event.reason).includes('failed to connect to websocket') ||
            String(event.reason?.message || '').includes('failed to connect to websocket') ||
            String(event.reason?.stack || '').includes('@vite/client')
          )
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event &&
          (
            String(event.message || '').includes('WebSocket closed') ||
            String(event.message || '').includes('failed to connect to websocket') ||
            String(event.filename || '').includes('@vite/client') ||
            String(event.message || '').includes('BillingNotEnabledMapError') ||
            String(event.message || '').includes('billing-not-enabled-map-error')
          )
        ) {
          event.preventDefault();
        }
      });

      // Immediate cache & service worker cleanup for dev/preview so stale service workers never hijack requests
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        const h = window.location.hostname || '';
        if (h.includes('ais-dev') || h.includes('ais-pre') || h.includes('run.app') || h.includes('localhost') || h.includes('127.0.0.1')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister().catch(function() {});
            }
          }).catch(function() {});
        }
      }
    </script>

        <div style="margin-top: 24px; display: flex; gap: 8px; align-items: center;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #f59e0b; animation: smartrun-dot 1.4s infinite ease-in-out both; animation-delay: -0.32s;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #f59e0b; animation: smartrun-dot 1.4s infinite ease-in-out both; animation-delay: -0.16s;"></div>

        </div>
      </div>
    </div>
    <script>
      // Watchdog: Ensure preloader element is gracefully dismissed once React mounts or after 1.5s max
      setTimeout(function() {
        var loader = document.getElementById('initial-smartrun-loader');
        if (loader && loader.parentNode) {
          loader.style.transition = 'opacity 0.25s ease';
          loader.style.opacity = '0';
          setTimeout(function() {
            try { if (loader && loader.parentNode) loader.parentNode.removeChild(loader); } catch(e) {}
          }, 250);
        }
      }, 1500);
    </script>

    <div id="recaptcha-container"></div>
